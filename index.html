<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>دعوة زفاف</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;

  background: #fffaf1;

  font-family:
    Tahoma,
    Arial,
    sans-serif;

  color: #9b7136;
}


/* ==================================
   إعداد الصفحات
================================== */

.page {

  position: relative;

  width: 100%;

  min-height: 100vh;

  background: #fffaf1;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

}


/* ==================================
   الصور
================================== */

.full-image {

  display: block;

  width: 100%;

  height: auto;

  max-width: 600px;

  margin: auto;

}


/* ==================================
   صفحة فتح المغلف
================================== */

#intro {

  min-height: 100vh;

  background: #fffaf1;

}


.video-box {

  position: relative;

  width: 100%;

  max-width: 600px;

  margin: auto;

}


#introVideo {

  display: block;

  width: 100%;

  height: auto;

  max-height: 100vh;

  object-fit: contain;

  background: #fffaf1;

}


/* زر شفاف فوق المغلف */

#openButton {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  border: none;

  background: transparent;

  cursor: pointer;

  z-index: 5;

}


/* عبارة فتح الدعوة */

#openText {

  position: absolute;

  left: 50%;

  bottom: 7%;

  transform: translateX(-50%);

  z-index: 6;

  padding: 10px 20px;

  border-radius: 50px;

  border:
    1px solid
    rgba(168, 122, 53, 0.45);

  background:
    rgba(255, 250, 241, 0.94);

  color: #91672f;

  font-size: 15px;

  white-space: nowrap;

  pointer-events: none;

  transition: opacity 0.4s ease;

}


/* ==================================
   زر الموسيقى
================================== */

#musicButton {

  position: fixed;

  left: 18px;

  bottom: 18px;

  z-index: 9999;

  width: 50px;

  height: 50px;

  border-radius: 50%;

  border:
    1px solid
    rgba(168, 122, 53, 0.45);

  background:
    rgba(255, 250, 241, 0.96);

  color: #9b7136;

  font-size: 19px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.08);

}


/* الموسيقى تعمل */

#musicButton.playing {

  background: #a87a35;

  color: #fffaf1;

}


/* ==================================
   سهم السحب
================================== */

.scroll-arrow {

  position: absolute;

  left: 50%;

  bottom: 12px;

  transform: translateX(-50%);

  z-index: 20;

  font-size: 28px;

  color:
    rgba(155,113,54,0.65);

  pointer-events: none;

  animation:
    arrowMove
    1.5s
    infinite;

}


@keyframes arrowMove {

  0% {

    transform:
      translate(-50%,0);

  }

  50% {

    transform:
      translate(-50%,8px);

  }

  100% {

    transform:
      translate(-50%,0);

  }

}


/* ==================================
   صفحة Save The Date
================================== */

#save {

  background: #fffaf1;

}


/* ==================================
   صفحة المعلومات
================================== */

#info {

  background: #fffaf1;

}


/* ==================================
   صفحة التايمر
================================== */

#timer {

  position: relative;

  width: 100%;

  min-height: 100vh;

  padding: 0;

  background-color: #fffaf1;

  background-image:
    url("timer.png");

  background-repeat:
    no-repeat;

  background-position:
    center;

  background-size:
    contain;

}


/* طبقة الأرقام */

.timer-page {

  position: relative;

  width: 100%;

  height: 100vh;

  max-width: 600px;

  margin: auto;

}


/* أرقام التايمر */

.timer-number {

  position: absolute;

  transform:
    translate(-50%, -50%);

  z-index: 20;

  color: #a87a35;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      22px,
      6vw,
      38px
    );

  font-weight: 500;

  text-align: center;

  direction: ltr;

  min-width: 50px;

}


/* يوم */

.days-number {

  left: 78%;

  top: 73%;

}


/* ساعة */

.hours-number {

  left: 59%;

  top: 73%;

}


/* دقيقة */

.minutes-number {

  left: 40%;

  top: 73%;

}


/* ثانية */

.seconds-number {

  left: 21%;

  top: 73%;

}


/* ==================================
   صفحة الموقع
================================== */

#location {

  min-height: 100vh;

  background: #fffaf1;

  flex-direction: column;

}


.location-link {

  display: block;

  width: 100%;

  max-width: 600px;

  margin: auto;

  text-decoration: none;

}


.location-image {

  display: block;

  width: 100%;

  height: auto;

}


/* زر الخريطة */

.map-button {

  position: absolute;

  left: 50%;

  bottom: 7%;

  transform: translateX(-50%);

  width:
    min(
      300px,
      80%
    );

  padding: 14px 25px;

  border-radius: 50px;

  background: #a87a35;

  color: white;

  text-align: center;

  text-decoration: none;

  font-size: 16px;

  z-index: 20;

}


/* ==================================
   الكمبيوتر
================================== */

@media (min-width: 700px) {

  body {

    background: #eee9df;

  }

  .page {

    width: 500px;

    margin:
      0
      auto;

  }

}


/* ==================================
   تقليل الحركة
================================== */

@media
(prefers-reduced-motion: reduce) {

  html {

    scroll-behavior: auto;

  }

  .scroll-arrow {

    animation: none;

  }

}

</style>

</head>


<body>



<!-- ==================================
     الموسيقى
================================== -->

<audio
  id="music"
  preload="auto"
  loop
>

  <source
    src="music.mp3"
    type="audio/mpeg"
  >

</audio>



<!-- زر الموسيقى -->

<button
  id="musicButton"
  type="button"
  aria-label="تشغيل أو إيقاف الموسيقى"
>

♫

</button>



<!-- ==================================
     1
     فتح المغلف
================================== -->

<section
  class="page"
  id="intro"
>

<div class="video-box">


<video
  id="introVideo"
  preload="auto"
  playsinline
  webkit-playsinline
  poster="cover.png"
>

  <source
    src="open.mp4"
    type="video/mp4"
  >

</video>



<button
  id="openButton"
  type="button"
  aria-label="فتح الدعوة"
>
</button>



<div id="openText">

اضغطي لفتح الدعوة

</div>


</div>

</section>



<!-- ==================================
     2
     Save The Date
================================== -->

<section
  class="page"
  id="save"
>


<img
  src="save.png"
  class="full-image"
  alt="Save the Date"
>


<div class="scroll-arrow">

⌄

</div>


</section>



<!-- ==================================
     3
     صفحة المعلومات
================================== -->

<section
  class="page"
  id="info"
>


<img
  src="info.png"
  class="full-image"
  alt="معلومات حفل الزفاف"
>


<div class="scroll-arrow">

⌄

</div>


</section>



<!-- ==================================
     4
     التايمر
================================== -->

<section
  class="page"
  id="timer"
>


<div class="timer-page">


<!-- يوم -->

<div
  class="timer-number days-number"
  id="days"
>

0

</div>



<!-- ساعة -->

<div
  class="timer-number hours-number"
  id="hours"
>

00

</div>



<!-- دقيقة -->

<div
  class="timer-number minutes-number"
  id="minutes"
>

00

</div>



<!-- ثانية -->

<div
  class="timer-number seconds-number"
  id="seconds"
>

00

</div>


</div>


<div class="scroll-arrow">

⌄

</div>


</section>



<!-- ==================================
     5
     الموقع
================================== -->

<section
  class="page"
  id="location"
>


<a
  class="location-link"
  href="https://maps.app.goo.gl/3q5waWoJhZ8CDxVu8"
  target="_blank"
  rel="noopener"
>


<img
  src="map.png"
  class="location-image"
  alt="موقع حفل الزفاف"
>


</a>



<a
  class="map-button"
  href="https://maps.app.goo.gl/3q5waWoJhZ8CDxVu8"
  target="_blank"
  rel="noopener"
>

فتح الموقع

</a>


</section>



<script>


/* ==================================
   العناصر
================================== */

const video =
document.getElementById(
  "introVideo"
);


const openButton =
document.getElementById(
  "openButton"
);


const openText =
document.getElementById(
  "openText"
);


const music =
document.getElementById(
  "music"
);


const musicButton =
document.getElementById(
  "musicButton"
);


let opened =
false;



/* ==================================
   فتح الدعوة
================================== */

openButton.addEventListener(

"click",

async function() {


if (opened) {

return;

}


opened =
true;


/* إخفاء عبارة فتح */

openText.style.opacity =
"0";


openButton.style.pointerEvents =
"none";



/* ==================================
   تشغيل الموسيقى فورًا
================================== */

try {


music.volume =
0.60;


await music.play();


musicButton.innerHTML =
"❚❚";


musicButton.classList.add(
  "playing"
);


} catch(error) {


console.log(
  "المتصفح منع تشغيل الموسيقى"
);


}



/* ==================================
   تشغيل فيديو فتح المغلف
================================== */

try {


video.currentTime =
0;


await video.play();


} catch(error) {


console.log(
  "تعذر تشغيل فيديو المغلف"
);


goToSave();


}


}

);



/* ==================================
   عندما ينتهي فيديو المغلف
================================== */

video.addEventListener(

"ended",

function() {


goToSave();


}

);



/* ==================================
   الانتقال إلى Save The Date
================================== */

function goToSave() {


document
.getElementById(
  "save"
)
.scrollIntoView({

behavior:
"smooth",

block:
"start"

});


}



/* ==================================
   زر الموسيقى
================================== */

musicButton.addEventListener(

"click",

async function() {


/* إذا كانت متوقفة */

if (music.paused) {


try {


await music.play();


musicButton.innerHTML =
"❚❚";


musicButton.classList.add(
  "playing"
);


} catch(error) {


console.log(
  "تعذر تشغيل الموسيقى"
);


}


}


/* إذا كانت تعمل */

else {


music.pause();


musicButton.innerHTML =
"♫";


musicButton.classList.remove(
  "playing"
);


}


}

);



/* ==================================
   تاريخ العرس

   27 / 7 / 2027

   الساعة 7 مساء
================================== */

const weddingDate =
new Date(

2027,

6,

27,

19,

0,

0

);



/* ==================================
   عناصر العداد
================================== */

const daysElement =
document.getElementById(
  "days"
);


const hoursElement =
document.getElementById(
  "hours"
);


const minutesElement =
document.getElementById(
  "minutes"
);


const secondsElement =
document.getElementById(
  "seconds"
);



/* ==================================
   تحديث العداد
================================== */

function updateCountdown() {


const now =
new Date();


let difference =
weddingDate - now;



/* انتهى الموعد */

if (
difference <= 0
) {


daysElement.textContent =
"0";


hoursElement.textContent =
"00";


minutesElement.textContent =
"00";


secondsElement.textContent =
"00";


return;


}



/* ==================================
   الحساب
================================== */

const totalSeconds =
Math.floor(
  difference / 1000
);



const days =
Math.floor(
  totalSeconds / 86400
);



const hours =
Math.floor(

(totalSeconds % 86400)

/ 3600

);



const minutes =
Math.floor(

(totalSeconds % 3600)

/ 60

);



const seconds =
totalSeconds % 60;



/* ==================================
   عرض الأرقام
================================== */

daysElement.textContent =
String(days);


hoursElement.textContent =
String(hours)
.padStart(
  2,
  "0"
);


minutesElement.textContent =
String(minutes)
.padStart(
  2,
  "0"
);


secondsElement.textContent =
String(seconds)
.padStart(
  2,
  "0"
);


}



/* تشغيل العداد مباشرة */

updateCountdown();



/* تحديث كل ثانية */

setInterval(

updateCountdown,

1000

);



/* ==================================
   في حال لم يعمل الفيديو
================================== */

video.addEventListener(

"error",

function() {


console.log(
  "تأكدي من وجود open.mp4"
);


}

);



/* ==================================
   في حال لم تعمل الموسيقى
================================== */

music.addEventListener(

"error",

function() {


console.log(
  "تأكدي من وجود music.mp3"
);


}

);


</script>


</body>

</html>
