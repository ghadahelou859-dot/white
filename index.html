<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>دعوة زفاف محمد ولين</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f3ed;
      font-family: Arial, sans-serif;
    }

    /* =========================
       شاشة المغلف
    ========================== */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #f7f3ed;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #intro img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #openButton {
      position: absolute;

      left: 50%;
      bottom: 20%;

      transform: translateX(-50%);

      border: none;
      outline: none;

      padding: 14px 30px;

      border-radius: 40px;

      background: rgba(248, 245, 239, 0.92);

      color: #b58d4c;

      font-size: 20px;
      font-weight: 500;

      cursor: pointer;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.10);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }


    /* =========================
       الفيديو
    ========================== */

    #videoScreen {
      position: fixed;
      inset: 0;

      z-index: 90;

      display: none;

      background: #f7f3ed;
    }

    #openingVideo {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* =========================
       صفحات الدعوة
    ========================== */

    #pages {
      position: fixed;
      inset: 0;

      display: none;

      overflow-y: auto;
      overflow-x: hidden;

      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;

      background: #f7f3ed;
    }

    .page {
      width: 100%;
      height: 100svh;

      position: relative;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      overflow: hidden;

      background: #f7f3ed;
    }

    .page img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* =========================
       زر الموقع
    ========================== */

    .location-page {
      position: relative;
    }

    .map-button {
      position: absolute;

      left: 50%;
      transform: translateX(-50%);

      bottom: 17%;

      width: 62%;
      height: 8%;

      z-index: 20;

      background: transparent;

      cursor: pointer;
    }


    /* =========================
       شاشة كمبيوتر
    ========================== */

    @media (min-width: 700px) {

      body {
        background: #e8e2da;
      }

      #intro,
      #videoScreen,
      #pages {
        width: 500px;
        max-width: 100%;

        left: 50%;
        right: auto;

        transform: translateX(-50%);
      }
    }
  </style>
</head>


<body>

  <!-- =========================
       1. المغلف
  ========================== -->

  <section id="intro">

    <img
      src="./envelope.jpeg"
      alt="دعوة محمد ولين"
    />

    <button id="openButton">
      اضغط هنا
    </button>

  </section>


  <!-- =========================
       2. فيديو فتح المغلف
  ========================== -->

  <section id="videoScreen">

    <video
      id="openingVideo"
      playsinline
      preload="auto"
    >

      <source
        src="./opening.mp4"
        type="video/mp4"
      />

    </video>

  </section>


  <!-- =========================
       الصفحات
  ========================== -->

  <main id="pages">


    <!-- =========================
         الصفحة الأولى
         SAVE THE DATE
    ========================== -->

    <section class="page">

      <img
        src="./save-the-date.jpeg"
        alt="Save The Date"
      />

    </section>



    <!-- =========================
         الصفحة الثانية
         العد التنازلي
    ========================== -->

    <section class="page">

      <img
        src="./countdown.jpeg"
        alt="العد التنازلي"
      />

    </section>



    <!-- =========================
         الصفحة الثالثة
         معلومات العرس
    ========================== -->

    <section class="page">

      <img
        src="./wedding-info.jpeg"
        alt="معلومات العرس"
      />

    </section>



    <!-- =========================
         الصفحة الرابعة
         الموقع
    ========================== -->

    <section class="page location-page">

      <img
        src="./location.jpeg"
        alt="موقع حفل الزفاف"
      />


      <!--
      بدلي رابط Google Maps لاحقًا
      بالرابط الحقيقي للقاعة
      -->

      <a
        class="map-button"
        href="https://maps.google.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="افتح الموقع على الخريطة"
      ></a>

    </section>

  </main>



  <script>

    const intro =
      document.getElementById("intro");

    const openButton =
      document.getElementById("openButton");

    const videoScreen =
      document.getElementById("videoScreen");

    const openingVideo =
      document.getElementById("openingVideo");

    const pages =
      document.getElementById("pages");


    /* =========================
       عند الضغط على المغلف
    ========================== */

    openButton.addEventListener(
      "click",
      function () {

        intro.style.display = "none";

        videoScreen.style.display = "block";

        openingVideo.currentTime = 0;


        openingVideo
          .play()
          .catch(function () {

            /*
            لو حصلت مشكلة في تشغيل الفيديو
            يدخل مباشرة للصفحات
            */

            showInvitation();

          });

      }
    );


    /* =========================
       بعد انتهاء الفيديو
    ========================== */

    openingVideo.addEventListener(
      "ended",
      function () {

        showInvitation();

      }
    );


    function showInvitation() {

      openingVideo.pause();

      videoScreen.style.display = "none";

      pages.style.display = "block";

      pages.scrollTo({
