<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>دعوة زفاف محمد ولين</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f3ed;
      font-family: Arial, sans-serif;
    }

    /* =========================
       شاشة المغلف
    ========================== */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f7f3ed;
    }

    #intro img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #openButton {
      position: absolute;

      left: 50%;
      bottom: 19%;

      transform: translateX(-50%);

      z-index: 120;

      border: none;
      outline: none;

      padding: 15px 34px;

      border-radius: 45px;

      background: rgba(255, 255, 255, 0.93);
      color: #b58d4c;

      font-size: 20px;
      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.10);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }


    /* =========================
       الفيديو
    ========================== */

    #videoScreen {
      position: fixed;
      inset: 0;

      z-index: 90;

      display: none;

      background: #f7f3ed;
    }

    #openingVideo {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* =========================
       صفحات الدعوة
    ========================== */

    #pages {
      position: fixed;
      inset: 0;

      display: none;

      overflow-y: auto;
      overflow-x: hidden;

      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;

      background: #f7f3ed;
    }

    .page {
      width: 100%;
      height: 100svh;

      position: relative;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      overflow: hidden;

      background: #f7f3ed;
    }

    .page img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* =========================
       زر الموقع
    ========================== */

    .map-button {
      position: absolute;

      left: 50%;
      transform: translateX(-50%);

      bottom: 17%;

      width: 64%;
      height: 8%;

      z-index: 20;

      background: transparent;

      cursor: pointer;
    }


    /* =========================
       زر الموسيقى العائم
    ========================== */

    #musicButton {
      position: fixed;

      right: 18px;
      bottom: 24px;

      z-index: 300;

      width: 52px;
      height: 52px;

      border-radius: 50%;
      border: 1px solid rgba(181, 141, 76, 0.45);

      background: rgba(255, 255, 255, 0.92);

      color: #b58d4c;

      font-size: 23px;

      display: none;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.12);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      touch-action: manipulation;
    }


    /* =========================
       شاشة الكمبيوتر
    ========================== */

    @media (min-width: 700px) {

      body {
        background: #e8e2da;
      }

      #intro,
      #videoScreen,
      #pages {
        width: 500px;
        max-width: 100%;

        left: 50%;
        right: auto;

        transform: translateX(-50%);
      }

      #musicButton {
        right: calc(50% - 230px);
      }
    }
  </style>
</head>


<body>

  <!-- =========================
       1. المغلف
  ========================== -->

  <section id="intro">

    <img
      src="./envelope.jpeg"
      alt="دعوة محمد ولين"
    />

    <button id="openButton" type="button">
      اضغط هنا
    </button>

  </section>


  <!-- =========================
       2. فيديو فتح المغلف
  ========================== -->

  <section id="videoScreen">

    <video
      id="openingVideo"
      playsinline
      webkit-playsinline
      preload="auto"
      muted
    >

      <source
        src="./opening.mp4"
        type="video/mp4"
      />

    </video>

  </section>


  <!-- =========================
       الموسيقى
  ========================== -->

  <audio
    id="bgMusic"
    loop
    preload="auto"
  >
    <source
      src="./music.mp3"
      type="audio/mpeg"
    />
  </audio>


  <!-- =========================
       زر تشغيل/إيقاف الموسيقى
  ========================== -->

  <button
    id="musicButton"
    type="button"
    aria-label="تشغيل أو إيقاف الموسيقى"
  >
    ♪
  </button>


  <!-- =========================
       صفحات الدعوة
  ========================== -->

  <main id="pages">


    <!-- 1. Save The Date -->

    <section class="page">

      <img
        src="./save-the-date.jpeg"
        alt="Save The Date"
      />

    </section>


    <!-- 2. العد التنازلي -->

    <section class="page">

      <img
        src="./countdown.jpeg"
        alt="العد التنازلي"
      />

    </section>


    <!-- 3. معلومات العرس -->

    <section class="page">

      <img
        src="./wedding-info.jpeg"
        alt="معلومات العرس"
      />

    </section>


    <!-- 4. الموقع -->

    <section class="page">

      <img
        src="./location.jpeg"
        alt="موقع حفل الزفاف"
      />

      <a
        class="map-button"
        href="https://maps.app.goo.gl/3LUZ8aMZ1nCqh6jG7?g_st=ic"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="افتح الموقع على الخريطة"
      ></a>

    </section>

  </main>


  <script>

    const intro =
      document.getElementById("intro");

    const openButton =
      document.getElementById("openButton");

    const videoScreen =
      document.getElementById("videoScreen");

    const openingVideo =
      document.getElementById("openingVideo");

    const pages =
      document.getElementById("pages");

    const bgMusic =
      document.getElementById("bgMusic");

    const musicButton =
      document.getElementById("musicButton");


    let musicPlaying = false;


    /* =========================
       الضغط على "اضغط هنا"
    ========================== */

    openButton.addEventListener(
      "click",
      function () {

        /*
        إظهار الفيديو أولًا
        */

        videoScreen.style.display = "block";


        /*
        إعادة الفيديو للبداية
        */

        openingVideo.currentTime = 0;

        openingVideo.muted = true;


        /*
        تشغيل الفيديو
        من نفس ضغطة المستخدم
        */

        openingVideo
          .play()
          .then(function () {

            /*
            تشغيل الموسيقى
            بعد الضغط على "اضغط هنا"
            */

            bgMusic.currentTime = 0;

            bgMusic.volume = 0.45;


            return bgMusic.play();

          })
          .then(function () {

            musicPlaying = true;

            musicButton.textContent = "♫";

            musicButton.style.display = "flex";

            intro.style.display = "none";

          })
          .catch(function (error) {

            console.log("Playback error:", error);

            /*
            حتى لو رفض المتصفح الموسيقى،
            يستمر الفيديو والدعوة
            */

            intro.style.display = "none";

            musicButton.style.display = "flex";

          });

      }
    );


    /* =========================
       بعد انتهاء الفيديو
    ========================== */

    openingVideo.addEventListener(
      "ended",
      function () {

        videoScreen.style.display = "none";

        pages.style.display = "block";

        pages.scrollTo({
          top: 0,
          behavior: "auto"
        });

      }
    );


    /* =========================
       زر الموسيقى
       تشغيل / إيقاف
    ========================== */

    musicButton.addEventListener(
      "click",
      function () {

        if (musicPlaying) {

          bgMusic.pause();

          musicPlaying = false;

          musicButton.textContent = "♪";

        } else {

          bgMusic
            .play()
            .then(function () {

              musicPlaying = true;

              musicButton.textContent = "♫";

            })
            .catch(function (error) {

              console.log(
                "Music play error:",
                error
              );

            });

        }

      }
    );


    /* =========================
       إذا توقفت الموسيقى لأي سبب
    ========================== */

    bgMusic.addEventListener(
      "pause",
      function () {

        musicPlaying = false;

        musicButton.textContent = "♪";

      }
    );


    bgMusic.addEventListener(
      "play",
      function () {

        musicPlaying = true;

        musicButton.textContent = "♫";

      }
    );

  </script>


</body>
</html>
