<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دعوة زفاف محمد ولين</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8f5ef;
      font-family: Arial, sans-serif;
    }

    /* =========================
       واجهة البداية
    ========================== */

    #introScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f5ef;
      transition: opacity 0.6s ease;
    }

    #introScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #introImage {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #openBtn {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;

      border: none;
      background: rgba(248, 245, 239, 0.9);
      color: #b58d4c;

      padding: 13px 28px;
      border-radius: 40px;

      font-size: 20px;
      cursor: pointer;

      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    /* =========================
       شاشة الفيديو
    ========================== */

    #videoScreen {
      position: fixed;
      inset: 0;
      z-index: 90;

      display: none;
      align-items: center;
      justify-content: center;

      background: #f8f5ef;
    }

    #openingVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #f8f5ef;
    }

    /* =========================
       صفحات الدعوة
    ========================== */

    #pages {
      position: fixed;
      inset: 0;

      overflow-y: auto;
      overflow-x: hidden;

      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;

      background: #f8f5ef;

      visibility: hidden;
      opacity: 0;

      transition: opacity 0.7s ease;

      -webkit-overflow-scrolling: touch;
    }

    #pages.show {
      visibility: visible;
      opacity: 1;
    }

    .page {
      width: 100%;
      height: 100svh;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      background: #f8f5ef;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =========================
       العد التنازلي الحقيقي
    ========================== */

    .countdown-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .countdown {
      position: absolute;

      top: 44%;
      left: 50%;
      transform: translateX(-50%);

      width: 82%;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;

      direction: ltr;
    }

    .count-box {
      min-height: 105px;

      border: 1px solid rgba(181, 141, 76, 0.65);
      border-radius: 18px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: rgba(255, 255, 255, 0.15);
      color: #b58d4c;
    }

    .count-number {
      font-family: Georgia, serif;
      font-size: clamp(27px, 7vw, 45px);
      line-height: 1;
    }

    .count-label {
      margin-top: 10px;
      font-size: clamp(11px, 3vw, 17px);
      direction: rtl;
    }

    /* =========================
       زر الموقع
    ========================== */

    .location-page {
      position: relative;
    }

    .map-link {
      position: absolute;

      left: 50%;
      transform: translateX(-50%);

      bottom: 18%;

      width: 58%;
      height: 8%;

      z-index: 10;

      background: transparent;
      border: none;
      cursor: pointer;
    }

    /* =========================
       للشاشات الكبيرة
    ========================== */

    @media (min-width: 700px) {
      body {
        background: #e9e4dc;
      }

      #introScreen,
      #videoScreen,
      #pages {
        width: 500px;
        max-width: 100%;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>

  <!-- =====================================
       1. واجهة المغلف
  ====================================== -->

  <section id="introScreen">

    <img
      id="introImage"
      src="envelope.jpeg"
      alt="دعوة محمد ولين"
    />

    <button id="openBtn">
      اضغط هنا
    </button>

  </section>


  <!-- =====================================
       2. فيديو فتح المغلف
  ====================================== -->

  <section id="videoScreen">

    <video
      id="openingVideo"
      playsinline
      preload="auto"
    >
      <source src="opening.mp4" type="video/mp4" />
    </video>

  </section>


  <!-- =====================================
       الصفحات
  ====================================== -->

  <main id="pages">


    <!-- =====================================
         3. Save The Date
    ====================================== -->

    <section class="page">

      <img
        src="save-the-date.jpeg"
        alt="Save The Date"
      />

    </section>


    <!-- =====================================
         4. العد التنازلي
    ====================================== -->

    <section class="page">

      <img
        src="countdown.jpeg"
        alt="العد التنازلي"
      />

      <div class="countdown-overlay">

        <div class="countdown">

          <div class="count-box">
            <div id="days" class="count-number">00</div>
            <div class="count-label">يوم</div>
          </div>

          <div class="count-box">
            <div id="hours" class="count-number">00</div>
            <div class="count-label">ساعة</div>
          </div>

          <div class="count-box">
            <div id="minutes" class="count-number">00</div>
            <div class="count-label">دقيقة</div>
          </div>

          <div class="count-box">
            <div id="seconds" class="count-number">00</div>
            <div class="count-label">ثانية</div>
          </div>

        </div>

      </div>

    </section>


    <!-- =====================================
         5. معلومات العرس

         ملاحظة:
         هذه الصورة يجب رفعها إلى GitHub
         باسم wedding-info.jpeg
    ====================================== -->

    <section class="page">

      <img
        src="wedding-info.jpeg"
        alt="معلومات العرس"
      />

    </section>


    <!-- =====================================
         6. الموقع
    ====================================== -->

    <section class="page location-page">

      <img
        src="location.jpeg"
        alt="موقع حفل الزفاف"
      />

      <a
        class="map-link"
        href="https://maps.google.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="افتح الموقع على الخريطة"
      ></a>

    </section>

  </main>


  <script>

    /* =========================
       عناصر الصفحة
    ========================== */

    const introScreen =
      document.getElementById("introScreen");

    const openBtn =
      document.getElementById("openBtn");

    const videoScreen =
      document.getElementById("videoScreen");

    const openingVideo =
      document.getElementById("openingVideo");

    const pages =
      document.getElementById("pages");


    /* =========================
       الضغط على افتح
    ========================== */

    openBtn.addEventListener("click", async () => {

      introScreen.classList.add("hidden");

      setTimeout(async () => {

        introScreen.style.display = "none";

        videoScreen.style.display = "flex";

        openingVideo.currentTime = 0;

        try {
          await openingVideo.play();
        } catch (error) {
          console.log("Video error:", error);

          showPages();
        }

      }, 500);

    });


    /* =========================
       بعد انتهاء الفيديو
    ========================== */

    openingVideo.addEventListener("ended", () => {

      showPages();

    });


    function showPages() {

      videoScreen.style.display = "none";

      pages.classList.add("show");

      pages.scrollTo({
        top: 0,
        behavior: "auto"
      });

    }


    /* =========================
       العد التنازلي

       26 / 10 / 2026
       الساعة 7 مساءً
    ========================== */

    const weddingDate =
      new Date("2026-10-26T19:00:00+03:00");


    function updateCountdown() {

      const now = new Date();

      const distance =
        weddingDate.getTime() - now.getTime();


      if (distance <= 0) {

        document.getElementById("days").textContent =
          "00";

        document.getElementById("hours").textContent =
          "00";

        document.getElementById("minutes").textContent =
          "00";

        document.getElementById("seconds").textContent =
          "00";

        return;
      }


      const days =
        Math.floor(
          distance /
          (1000 * 60 * 60 * 24)
        );


      const hours =
        Math.floor(
          (
            distance %
            (1000 * 60 * 60 * 24)
          ) /
          (1000 * 60 * 60)
        );


      const minutes =
        Math.floor(
          (
            distance %
            (1000 * 60 * 60)
          ) /
          (1000 * 60)
        );


      const seconds =
        Math.floor(
          (
            distance %
            (1000 * 60)
          ) /
          1000
        );


      document.getElementById("days").textContent =
        String(days).padStart(2, "0");


      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");


      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");


      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");

    }


    updateCountdown();

    setInterval(updateCountdown, 1000);

  </script>

</body>
</html>
