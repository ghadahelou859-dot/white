<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
  >

  <title>دعوة زفاف محمد ولين</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f8f5f0;
      overflow-x: hidden;
      font-family: Arial, Tahoma, sans-serif;
      color: #9d6d27;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    img,
    video {
      display: block;
      width: 100%;
      height: auto;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      background: #f8f5f0;
    }

    /* الغلاف */

    #coverPage {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #coverPage img {
      width: 100%;
      height: auto;
    }

    #openInvitation {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 14px 36px;

      border: 1px solid #ba8a42;
      border-radius: 999px;

      background: rgba(255, 253, 249, 0.94);
      color: #a87325;

      font-size: 18px;
      font-weight: bold;

      box-shadow: 0 8px 24px rgba(70, 55, 35, 0.18);
      cursor: pointer;
      white-space: nowrap;
    }

    #openInvitation:active {
      transform: translateX(-50%) scale(0.97);
    }

    /* فيديو فتح المغلف */

    #openingPage {
      display: none;
      min-height: 100svh;
      background: #f8f5f0;
      align-items: center;
      justify-content: center;
    }

    #openingVideo {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* باقي صفحات الدعوة */

    #invitationPages {
      display: none;
      width: 100%;
    }

    /* زر الموسيقى */

    #musicButton {
      position: fixed;

      top: max(14px, env(safe-area-inset-top));
      left: 14px;

      z-index: 1000;

      display: none;

      width: 46px;
      height: 46px;

      border: 1px solid rgba(180, 132, 57, 0.65);
      border-radius: 50%;

      background: rgba(255, 253, 249, 0.94);
      color: #a87325;

      font-size: 20px;

      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      cursor: pointer;
    }

    /* العداد */

    #countdownPage {
      position: relative;
    }

    #countdownNumbers {
      position: absolute;

      top: 45.5%;
      left: 8.7%;

      width: 82.6%;
      height: 9%;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      direction: ltr;
      align-items: start;

      color: #ad7623;

      font-size: clamp(24px, 8vw, 42px);
      font-weight: bold;
      text-align: center;

      text-shadow: 0 1px 2px #ffffff;
      pointer-events: none;
    }

    #countdownNumbers span {
      padding-top: 4%;
    }

    /* صفحة الموقع */

    #locationPage {
      position: relative;
    }

    /*
      زر شفاف فوق زر "افتح الموقع على الخريطة"
      الموجود أصلًا داخل الصورة
    */

    #mapButton {
      position: absolute;

      left: 50%;
      bottom: 17.2%;
      transform: translateX(-50%);

      z-index: 15;

      width: 48%;
      height: 8%;

      background: transparent;
      border: none;
      border-radius: 25px;

      color: transparent;
      text-decoration: none;
      cursor: pointer;
    }

    /*
      زر تأكيد الحضور
    */

    #rsvpButton {
      position: absolute;

      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);

      z-index: 15;

      width: 72%;
      padding: 14px;

      border: 1px solid #b98537;
      border-radius: 999px;

      background: rgba(255, 253, 249, 0.95);
      color: #a87325;

      font-size: 17px;
      font-weight: bold;

      box-shadow: 0 7px 20px rgba(74, 56, 31, 0.16);
      cursor: pointer;
    }

    #rsvpButton:active {
      transform: translateX(-50%) scale(0.97);
    }

    /* نافذة تأكيد الحضور */

    #rsvpOverlay {
      position: fixed;
      inset: 0;

      z-index: 5000;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(54, 45, 36, 0.55);
      backdrop-filter: blur(6px);
    }

    #rsvpOverlay.show {
      display: flex;
    }

    .rsvp-card {
      position: relative;

      width: min(92vw, 430px);
      max-height: 90vh;
      overflow-y: auto;

      padding: 30px 22px 24px;

      border-radius: 25px;

      background: #fffdf9;

      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.24);
      text-align: center;
    }

    #closeRsvp {
      position: absolute;

      top: 11px;
      left: 13px;

      width: 38px;
      height: 38px;

      border: none;
      border-radius: 50%;

      background: #f2e9da;
      color: #956a2e;

      font-size: 22px;
      cursor: pointer;
    }

    .rsvp-card h2 {
      margin-bottom: 8px;
      color: #a87325;
      font-size: 25px;
    }

    .rsvp-card p {
      margin-bottom: 20px;
      color: #806b50;
      font-size: 15px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 13px;
      text-align: right;
    }

    .field label {
      display: block;
      margin-bottom: 7px;

      color: #6f5738;
      font-size: 14px;
      font-weight: bold;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 14px;

      border: 1px solid #dec8a4;
      border-radius: 14px;

      background: #ffffff;
      color: #56442e;

      font-size: 16px;
      outline: none;
    }

    .attendance-options {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;
      margin-bottom: 17px;
    }

    .attendance-option input {
      display: none;
    }

    .attendance-option label {
      display: block;
      padding: 13px 8px;

      border: 1px solid #ddc69f;
      border-radius: 14px;

      background: #ffffff;
      color: #80613a;

      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .attendance-option input:checked + label {
      background: #ead8b8;
      border-color: #bc8a3d;
      color: #76501b;
    }

    #sendRsvp {
      width: 100%;
      padding: 15px;

      border: none;
      border-radius: 999px;

      background: linear-gradient(135deg, #b88940, #9f6d25);
      color: #ffffff;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    @media (min-width: 501px) {
      body {
        background: #e9e4de;
      }

      .page {
        box-shadow: 0 0 28px rgba(0, 0, 0, 0.12);
      }
    }
  </style>
</head>

<body>

  <!-- زر الموسيقى -->

  <button
    id="musicButton"
    type="button"
    aria-label="تشغيل أو إيقاف الموسيقى"
  >
    🔊
  </button>

  <audio
    id="backgroundMusic"
    src="./music.mp3"
    loop
    preload="auto"
  ></audio>

  <!-- 01 الغلاف -->

  <section
    id="coverPage"
    class="page"
  >

    <img
      src="./envelope.jpeg"
      alt="مغلف دعوة الزفاف"
    >

    <button
      id="openInvitation"
      type="button"
    >
      افتح الدعوة
    </button>

  </section>

  <!-- 02 فيديو فتح المغلف -->

  <section
    id="openingPage"
    class="page"
  >

    <video
      id="openingVideo"
      muted
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source
        src="./opening.mp4"
        type="video/mp4"
      >
    </video>

  </section>

  <!-- باقي الكرت -->

  <main id="invitationPages">

    <!-- 03 Save the Date -->

    <section class="page">

      <img
        src="./save-the-date.jpeg"
        alt="Save the Date"
      >

    </section>

    <!-- 04 معلومات الزفاف -->

    <section class="page">

      <img
        src="./wedding-info.jpeg"
        alt="معلومات حفل زفاف محمد ولين"
      >

    </section>

    <!-- 05 العد التنازلي -->

    <section
      id="countdownPage"
      class="page"
    >

      <img
        src="./countdown.jpeg"
        alt="العد التنازلي للحفل"
      >

      <div
        id="countdownNumbers"
        aria-live="polite"
      >
        <span id="days">0</span>
        <span id="hours">00</span>
        <span id="minutes">00</span>
        <span id="seconds">00</span>
      </div>

    </section>

    <!-- 06 الموقع -->

    <section
      id="locationPage"
      class="page"
    >

      <img
        src="./location.jpeg"
        alt="موقع قاعة إيليا"
      >

      <a
        id="mapButton"
        href="https://maps.app.goo.gl/Y6F9H54yMgRiaBzA9"
        target="_blank"
        rel="noopener"
        aria-label="فتح موقع قاعة إيليا على الخريطة"
      >
        فتح الموقع
      </a>

      <button
        id="rsvpButton"
        type="button"
      >
        تأكيد الحضور
      </button>

    </section>

  </main>

  <!-- نافذة تأكيد الحضور -->

  <div id="rsvpOverlay">

    <div class="rsvp-card">

      <button
        id="closeRsvp"
        type="button"
        aria-label="إغلاق"
      >
        ×
      </button>

      <h2>
        تأكيد الحضور
      </h2>

      <p>
        يسعدنا أن تشاركونا فرحتنا 🤍
      </p>

      <div class="field">

        <label for="guestName">
          الاسم
        </label>

        <input
          id="guestName"
          type="text"
          placeholder="اكتب اسمك"
          autocomplete="name"
        >

      </div>

      <div class="field">

        <label for="guestCount">
          عدد الحضور
        </label>

        <select id="guestCount">

          <option value="1">شخص واحد</option>
          <option value="2">شخصان</option>
          <option value="3">3 أشخاص</option>
          <option value="4">4 أشخاص</option>
          <option value="5">5 أشخاص</option>
          <option value="6">6 أشخاص</option>

        </select>

      </div>

      <div class="attendance-options">

        <div class="attendance-option">

          <input
            id="attendingYes"
            type="radio"
            name="attendance"
            value="سأحضر"
            checked
          >

          <label for="attendingYes">
            سأحضر 🤍
          </label>

        </div>

        <div class="attendance-option">

          <input
            id="attendingNo"
            type="radio"
            name="attendance"
            value="أعتذر عن الحضور"
          >

          <label for="attendingNo">
            أعتذر
          </label>

        </div>

      </div>

      <button
        id="sendRsvp"
        type="button"
      >
        إرسال عبر واتساب
      </button>

    </div>

  </div>

  <script>
    const coverPage =
      document.getElementById("coverPage");

    const openingPage =
      document.getElementById("openingPage");

    const openingVideo =
      document.getElementById("openingVideo");

    const invitationPages =
      document.getElementById("invitationPages");

    const openInvitation =
      document.getElementById("openInvitation");

    const backgroundMusic =
      document.getElementById("backgroundMusic");

    const musicButton =
      document.getElementById("musicButton");

    const rsvpButton =
      document.getElementById("rsvpButton");

    const rsvpOverlay =
      document.getElementById("rsvpOverlay");

    const closeRsvp =
      document.getElementById("closeRsvp");

    const sendRsvp =
      document.getElementById("sendRsvp");

    /*
      فتح الدعوة
    */

    openInvitation.addEventListener(
      "click",
      async function () {

        coverPage.style.display = "none";
        openingPage.style.display = "flex";
        musicButton.style.display = "block";

        window.scrollTo(0, 0);

        backgroundMusic.volume = 0.35;

        try {
          await backgroundMusic.play();
          musicButton.textContent = "🔊";
        } catch (error) {
          musicButton.textContent = "🔇";
        }

        try {
          openingVideo.currentTime = 0;
          await openingVideo.play();
        } catch (error) {
          openingVideo.controls = true;
        }

      }
    );

    /*
      بعد انتهاء فيديو فتح المغلف
    */

    openingVideo.addEventListener(
      "ended",
      function () {

        openingPage.style.display = "none";
        invitationPages.style.display = "block";

        window.scrollTo(0, 0);

      }
    );

    /*
      في حال ضغط المستخدم على الفيديو
    */

    openingVideo.addEventListener(
      "click",
      function () {

        openingVideo
          .play()
          .catch(function () {});

      }
    );

    /*
      تشغيل وإيقاف الموسيقى
    */

    musicButton.addEventListener(
      "click",
      async function () {

        if (backgroundMusic.paused) {

          try {
            await backgroundMusic.play();
            musicButton.textContent = "🔊";
          } catch (error) {}

        } else {

          backgroundMusic.pause();
          musicButton.textContent = "🔇";

        }

      }
    );

    /*
      العد التنازلي
      26 أكتوبر 2026
      الساعة 7:00 مساءً
    */

    const weddingDate =
      new Date("2026-10-26T19:00:00+02:00").getTime();

    function updateCountdown() {

      let difference =
        Math.max(
          0,
          weddingDate - new Date().getTime()
        );

      const days =
        Math.floor(
          difference / 86400000
        );

      difference =
        difference % 86400000;

      const hours =
        Math.floor(
          difference / 3600000
        );

      difference =
        difference % 3600000;

      const minutes =
        Math.floor(
          difference / 60000
        );

      const seconds =
        Math.floor(
          (difference % 60000) / 1000
        );

      document.getElementById("days").textContent =
        days;

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");

    }

    updateCountdown();

    setInterval(
      updateCountdown,
      1000
    );

    /*
      فتح تأكيد الحضور
    */

    rsvpButton.addEventListener(
      "click",
      function () {

        rsvpOverlay.classList.add("show");
        document.body.style.overflow = "hidden";

      }
    );

    /*
      إغلاق تأكيد الحضور
    */

    function closeRsvpPopup() {

      rsvpOverlay.classList.remove("show");
      document.body.style.overflow = "";

    }

    closeRsvp.addEventListener(
      "click",
      closeRsvpPopup
    );

    rsvpOverlay.addEventListener(
      "click",
      function (event) {

        if (event.target === rsvpOverlay) {
          closeRsvpPopup();
        }

      }
    );

    /*
      إرسال التأكيد إلى واتساب
      الرقم: 0598494977
    */

    sendRsvp.addEventListener(
      "click",
      function () {

        const guestName =
          document
            .getElementById("guestName")
            .value
            .trim();

        const guestCount =
          document
            .getElementById("guestCount")
            .value;

        const attendance =
          document.querySelector(
            'input[name="attendance"]:checked'
          ).value;

        if (!guestName) {

          alert("اكتب الاسم أولًا 🤍");
          return;

        }

        const message =
`تأكيد حضور زفاف محمد ولين 🤍

الاسم: ${guestName}
الحالة: ${attendance}
عدد الحضور: ${guestCount}

التاريخ: 26/10/2026
الوقت: 7:00 مساءً
المكان: قاعة إيليا - رام الله`;

        const whatsappURL =
          "https://wa.me/970598494977?text=" +
          encodeURIComponent(message);

        window.location.href =
          whatsappURL;

      }
    );
  </script>

</body>
</html>
